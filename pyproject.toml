[project]
name = "vitals"
version = "0.1.0"
description = "Local system monitor and log analyzer"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.5", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
vitals = "vitals.__main__:main"

[tool.setuptools]
packages = ["vitals", "vitals.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
